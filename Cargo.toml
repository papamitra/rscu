[package]
name = "rscu"
version = "0.1.0"
edition = "2024"

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman", "renderer_gl", "use_system_lib", "xwayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
tempfile = "3"
x11rb = "0.13"
ironrdp-server = { version = "0.13", default-features = false }
anyhow = "1"
async-trait = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
