[package]
name = "rscu"
version = "0.1.0"
edition = "2024"

[features]
default = ["rdp"]
rdp = ["dep:ironrdp-server", "dep:anyhow", "dep:async-trait", "dep:rcgen", "dep:tokio", "dep:font8x8"]

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman", "renderer_gl", "use_system_lib", "xwayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
tempfile = "3"
x11rb = "0.13"
ironrdp-server = { version = "0.13", optional = true, default-features = false }
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
rcgen = { version = "0.14", optional = true, default-features = false, features = ["ring", "crypto"] }
tokio = { version = "1", optional = true, features = ["rt", "sync", "time", "net", "macros"] }
font8x8 = { version = "0.3", optional = true }
